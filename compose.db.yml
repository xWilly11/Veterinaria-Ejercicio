name: veterinaria-adso
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: 3413988
      MYSQL_DATABASE: veterinaria_adso
    ports:
      - "127.0.0.1:${MYSQL_LOCAL_PORT:-3307}:3306"
    volumes:
      - mysql_veterinaria_data:/var/lib/mysql
    healthcheck:
 #     test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent"]
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - red_datos
networks:
  red_datos:
    driver: bridge
volumes:
  mysql_veterinaria_data:
